name: Build Flosi APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.flosi --project-name flosi --platforms android app
          rm -rf app/test
          cp *.dart app/lib/
          cp pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets
          cp icon.png icon_fg.png app/assets/
          sed -i 's/android:label="[^"]*"/android:label="Flosi"/' app/android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Generate icons
        working-directory: app
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Flosi APK ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
