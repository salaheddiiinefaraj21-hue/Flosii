name: Build Flosi APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --org com.flosi --project-name flosi --platforms android app
          rm -rf app/test
          cp *.dart app/lib/ 2>/dev/null || true
          cp lib/*.dart app/lib/ 2>/dev/null || true
          cp .github/workflows/*.dart app/lib/ 2>/dev/null || true
          for f in pubspec.yaml lib/pubspec.yaml .github/workflows/pubspec.yaml; do
            if [ -f "$f" ]; then cp "$f" app/pubspec.yaml; break; fi
          done
          for f in main db state util widgets txn_sheet home_page history_page reports_page loans_page more_page; do
            test -f app/lib/$f.dart || { echo "MISSING FILE: $f.dart"; exit 1; }
          done
          grep -q sqflite app/pubspec.yaml || { echo "MISSING FILE: pubspec.yaml"; exit 1; }
          mkdir -p app/assets
          cp icon.png icon_fg.png app/assets/
          sed -i 's/android:label="[^"]*"/android:label="Flosi"/' app/android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Generate icons
        working-directory: app
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Flosi APK ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
